
server:
  port: 9001
  shutdown: graceful

spring:
  application:
    name: recording-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: jdbc:postgresql://localhost:5432/recording
    username: user
    password: password
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/LivingVoices

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
